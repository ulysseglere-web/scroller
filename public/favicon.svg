<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="#000000"/>
  <rect x="6" y="6" width="500" height="500" rx="110" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>

  <!-- Infinite Scroll "S" Monogram -->
  <path d="M 172 256 C 172 184 212 164 256 164 C 316 164 344 200 344 244 C 344 300 276 312 256 312" 
        stroke="#ffffff" stroke-width="32" stroke-linecap="round" fill="none"/>
  <path d="M 256 200 C 236 200 168 212 168 268 C 168 312 196 348 256 348 C 300 348 340 328 340 256" 
        stroke="#ffffff" stroke-width="32" stroke-linecap="round" fill="none"/>

  <!-- Solo Core Red Dot -->
  <circle cx="256" cy="256" r="38" fill="#ff1e27" filter="url(#fav-glow)"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
</svg>